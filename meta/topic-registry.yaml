version: 1
modules:
  - id: 00-foundations
    title: Foundations
    description: How to read this handbook and orient yourself in the web stack
    order: 0
  - id: 01-computer-science
    title: Computer Science Fundamentals
    description: Bits, machines, runtimes, complexity, and core data structures
    order: 1
  - id: 02-internet
    title: Internet
    description: Networks, DNS, transport, HTTP family, and web auth primitives
    order: 2
  - id: 03-browser
    title: Browser
    description: Browser architecture, rendering pipeline, event loop, and memory
    order: 3
  - id: 04-html
    title: HTML
    description: Document semantics, forms, SEO metadata, and resource hints
    order: 4
  - id: 05-css
    title: CSS
    description: Cascade, layout systems, responsive design, and compositing
    order: 5
  - id: 06-javascript
    title: JavaScript
    description: Language semantics from values and scope through async and metaprogramming
    order: 6
  - id: 07-typescript
    title: TypeScript
    description: Types as a compile-time system on top of JavaScript
    order: 7
  - id: 08-jsx-and-react-runtime
    title: JSX and React Runtime
    description: JSX transforms, Virtual DOM, Fiber, and reconciliation before the React API surface
    order: 8
  - id: 09-browser-apis
    title: Browser APIs
    description: Storage, observers, workers, and platform APIs
    order: 9
  - id: 10-react
    title: React
    description: "React as a UI runtime: components, hooks, concurrent features, and compiler"
    order: 10
  - id: 11-nextjs
    title: Next.js
    description: App Router, server components, caching, streaming, and edge runtimes
    order: 11
  - id: 12-rendering
    title: Rendering
    description: CSR through PPR, hydration models, and caching layers
    order: 12
  - id: 13-performance
    title: Performance
    description: Bundles, runtime techniques, and Core Web Vitals
    order: 13
  - id: 14-build-tools
    title: Build Tools
    description: Runtimes, package managers, bundlers, and compilers
    order: 14
  - id: 15-architecture
    title: Architecture
    description: Application structure, state, design systems, monorepos, and micro frontends
    order: 15
  - id: 16-testing
    title: Testing
    description: Test pyramid and frontend testing tooling
    order: 16
  - id: 17-security
    title: Security
    description: Frontend threat model, browser security controls, and auth tokens
    order: 17
  - id: 18-accessibility
    title: Accessibility
    description: WCAG, ARIA, keyboard UX, and accessible component patterns
    order: 18
  - id: 19-deployment
    title: Deployment
    description: Containers, proxies, CDNs, CI/CD, and hosting platforms
    order: 19
  - id: 20-observability
    title: Observability
    description: DevTools, debugging, RUM, logging, and frontend telemetry
    order: 20
  - id: 21-frontend-system-design
    title: Frontend System Design
    description: Product-scale frontend design problems and trade-offs
    order: 21
  - id: 22-design-patterns
    title: Design Patterns
    description: Patterns used in frontend codebases — and when they hurt
    order: 22
  - id: 23-pwa-and-offline
    title: PWA and Offline
    description: Service workers, caching strategies, and offline UX
    order: 23
  - id: 24-interview-preparation
    title: Interview Preparation
    description: Question banks with deep answers linked to canonical topics
    order: 24
  - id: 25-appendix
    title: Appendix
    description: Cheatsheets, compatibility tables, and curriculum changelog
    order: 25
